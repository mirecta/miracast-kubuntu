[package]
name = "miracast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
gstreamer = "0.25"
gstreamer-app = "0.25"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace]
members = [".", "ui"]
